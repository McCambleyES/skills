<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feedback — preview</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;padding:24px 16px} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .stack{display:grid;gap:24px;max-width:720px} .theme{position:fixed;bottom:12px;right:12px}</style></head>
<body class="sc">
<button class="sc-btn sc-btn--outline sc-btn--sm theme" onclick="var r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark'">Toggle theme</button>
<div class="stack" style="max-width:24rem">
<div class="row"><span class="sc-avatar">CN</span><span class="sc-avatar sc-avatar--lg">JD</span><span class="sc-avatar sc-avatar--sm">A</span>
<span class="sc-avatar-group"><span class="sc-avatar">AB</span><span class="sc-avatar">CD</span><span class="sc-avatar">+3</span></span></div>
<div class="sc-progress" role="progressbar" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100"><span style="width:66%"></span></div>
<div class="row"><div class="sc-skeleton" style="width:48px;height:48px;border-radius:9999px"></div><div style="display:grid;gap:8px;flex:1"><div class="sc-skeleton" style="height:16px;width:80%"></div><div class="sc-skeleton" style="height:16px;width:60%"></div></div></div>
<div class="row" style="height:20px"><span>Blog</span><hr class="sc-separator sc-separator--vertical"><span>Docs</span><hr class="sc-separator sc-separator--vertical"><span>Source</span></div>
<div class="row sc-muted"><svg class="sc-spinner" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 12a9 9 0 1 1-6.219-8.56" /> </svg> Loading</div>
</div>
</body></html>
