<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button — preview</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;padding:24px 16px} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .stack{display:grid;gap:24px;max-width:720px} .theme{position:fixed;bottom:12px;right:12px}</style></head>
<body class="sc">
<button class="sc-btn sc-btn--outline sc-btn--sm theme" onclick="var r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark'">Toggle theme</button>
<div class="stack">
<div class="row">
<button class="sc-btn">Save changes</button>
<button class="sc-btn sc-btn--secondary">Secondary</button>
<button class="sc-btn sc-btn--outline">Outline</button>
<button class="sc-btn sc-btn--ghost">Ghost</button>
<button class="sc-btn sc-btn--destructive">Delete</button>
<a class="sc-btn sc-btn--link" href="#">Link</a>
</div>
<div class="row">
<button class="sc-btn sc-btn--sm">Small</button>
<button class="sc-btn">Default</button>
<button class="sc-btn sc-btn--lg">Large</button>
<button class="sc-btn sc-btn--outline"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /> <rect x="2" y="4" width="20" height="16" rx="2" /> </svg>Login with email</button>
<button class="sc-btn sc-btn--outline sc-btn--icon" aria-label="Next"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="m9 18 6-6-6-6" /> </svg></button>
<button class="sc-btn" disabled><svg class="sc-spinner" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 12a9 9 0 1 1-6.219-8.56" /> </svg>Please wait</button>
</div>
</div>
</body></html>
