<!doctype html>
<html><head><meta charset="utf-8"><title>Button — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;padding:24px;}</style></head>
<body class="pb">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px">
<button class="pb-btn pb-btn--primary pb-btn--lg">Get started</button>
<button class="pb-btn pb-btn--lg">Read the docs</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px">
<button class="pb-btn pb-btn--primary"><svg class="pb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New booking</button>
<button class="pb-btn">Cancel</button>
<button class="pb-btn pb-btn--secondary">Duplicate</button>
<button class="pb-btn pb-btn--outline"><svg class="pb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9.5M18.5 7H20M4 17h1.5M10.5 17H20"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>Filters</button>
<button class="pb-btn pb-btn--ghost"><svg class="pb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>Search <span class="pb-kbd">⌘K</span></button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
<button class="pb-btn pb-btn--danger"><svg class="pb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12"/></svg>Delete booking</button>
<button class="pb-btn pb-btn--danger-soft">Remove</button>
<button class="pb-btn pb-btn--sm">Small</button>
<button class="pb-btn pb-btn--icon" aria-label="Notifications"><svg class="pb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></button>
<button class="pb-btn pb-btn--primary" disabled>Disabled</button>
</div>
</body></html>
