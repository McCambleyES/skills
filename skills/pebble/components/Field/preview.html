<!doctype html>
<html><head><meta charset="utf-8"><title>Field — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;padding:24px;}</style></head>
<body class="pb">
<div class="pb-card" style="max-width:360px;gap:16px">
<div class="pb-field"><label for="n">Guest name</label><input id="n" class="pb-input" placeholder="e.g. Sam Rivera"><span class="pb-field__help">As it appears on their ID.</span></div>
<div class="pb-field"><label for="e">Email</label><input id="e" class="pb-input" value="sam@" aria-invalid="true" aria-describedby="e-err"><span id="e-err" class="pb-field__error">Enter a full email address, like name@example.com.</span></div>
<div class="pb-field"><label for="m">Notes</label><textarea id="m" class="pb-input" placeholder="Anything the front desk should know"></textarea></div>
<div class="pb-card__footer" style="justify-content:flex-end"><button class="pb-btn">Cancel</button><button class="pb-btn pb-btn--primary">Save guest</button></div>
</div>
</body></html>
