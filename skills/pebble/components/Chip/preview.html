<!doctype html>
<html><head><meta charset="utf-8"><title>Chip — preview</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;padding:24px;}</style></head>
<body class="pb">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px">
<span class="pb-chip">Draft</span>
<span class="pb-chip pb-chip--accent"><i></i>Scheduled</span>
<span class="pb-chip pb-chip--success"><svg class="pb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Paid</span>
<span class="pb-chip pb-chip--warning"><i></i>Pending</span>
<span class="pb-chip pb-chip--danger"><i></i>Overdue</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
<span class="pb-chip pb-chip--solid pb-chip--accent">New</span>
<span class="pb-chip pb-chip--solid pb-chip--success">Live</span>
<span class="pb-chip pb-chip--solid pb-chip--warning">Beta</span>
<span class="pb-chip pb-chip--solid pb-chip--danger">Failed</span>
<span class="pb-chip pb-chip--sm">sm</span><span class="pb-chip pb-chip--lg">Large</span>
</div>
</body></html>
